plugins {
    id "java"
    id "com.github.johnrengelman.shadow" version "8.1.1" apply false
    id "dev.architectury.loom" version "${architectury_loom_version}" apply false
}

allprojects {
    group = mod_group
    version = mod_version
}

subprojects {
    apply plugin: "java"

    java {
        sourceCompatibility = JavaVersion.toVersion(java_version)
        targetCompatibility = JavaVersion.toVersion(java_version)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = java_version as int
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        ["enabled", "levels", "corpus", "rounds", "warmups", "bandwidthMbps"].each { name ->
            def propertyName = "zstdnet.benchmark.${name}"
            if (System.getProperty(propertyName) != null) {
                systemProperty(propertyName, System.getProperty(propertyName))
            }
        }
    }
}
