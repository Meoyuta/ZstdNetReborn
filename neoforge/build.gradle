def clientLoomEnabled = (findProperty("client_loom_enabled") ?: "true").toString().toBoolean()
def neoforgeVariant = (findProperty("neoforge_variant") ?: "1_21_11").toString()
if (neoforgeVariant == "1_21_1") {
    version = neoforge_1211_mod_version
}
def namedClientJarEnabled = (findProperty("named_client_jar_enabled") ?: "false").toString().toBoolean()
def minecraftClientUrl = (findProperty("minecraft_client_url") ?: "").toString()
def namedClientJar = layout.buildDirectory.file("minecraft-client/${minecraft_version}.jar")
def mappedMinecraftJar = file(findProperty("mapped_minecraft_jar") ?: "${gradle.gradleUserHomeDir}/caches/fabric-loom/${minecraft_version}/neoforge/${neoforge_version}/minecraft-merged-mojang.jar")
def neoforgeUniversalJar = file(findProperty("neoforge_universal_jar") ?: "${gradle.gradleUserHomeDir}/caches/fabric-loom/${minecraft_version}/neoforge/${neoforge_version}/forge-universal.jar")
def neoforgeLoaderJar = file(findProperty("neoforge_loader_jar") ?: "${gradle.gradleUserHomeDir}/caches/modules-2/files-2.1/net.neoforged.fancymodloader/loader/${neoforge_fml_loader_version}/76e15f98bf676fb44b36c5e776f52a55581ec43a/loader-${neoforge_fml_loader_version}.jar")
def neoforgeBusJar = file(findProperty("neoforge_bus_jar") ?: "${gradle.gradleUserHomeDir}/caches/modules-2/files-2.1/net.neoforged/bus/8.0.5/5b2d33285ab5d1554e9798ad98c40d6ea3868bd5/bus-8.0.5.jar")
def spongeMixinJar = file(findProperty("sponge_mixin_jar") ?: "${gradle.gradleUserHomeDir}/caches/modules-2/files-2.1/net.fabricmc/sponge-mixin/0.17.3+mixin.0.8.7/41c4a3984a80f4679e759fb9f495587acc5cdac7/sponge-mixin-0.17.3+mixin.0.8.7.jar")

if (!(neoforgeVariant in ["1_21_1", "1_21_11", "26_1"])) {
    throw new GradleException("neoforge_variant must be 1_21_1, 1_21_11, or 26_1")
}

def variantJavaRoots = switch (neoforgeVariant) {
    case "1_21_1" -> ["client", "1_21_1"]
    case "1_21_11" -> ["client", "1_21_11"]
    default -> ["client", "26_1"]
}
def variantResourceRoots = neoforgeVariant == "1_21_1"
    ? ["client", "1_21_1"]
    : ["client", "client-entry"]
sourceSets.main.java.setSrcDirs(variantJavaRoots.collect { file("src/${it}/java") })
sourceSets.main.resources.setSrcDirs(variantResourceRoots.collect { file("src/${it}/resources") })

if (clientLoomEnabled) {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }
}

repositories {
    mavenCentral()
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://maven.neoforged.net/releases/" }
}

if (namedClientJarEnabled) {
    tasks.register("downloadMinecraftClientJar") {
        outputs.file(namedClientJar)
        doLast {
            if (minecraftClientUrl.isBlank()) {
                throw new GradleException("minecraft_client_url is required when named_client_jar_enabled=true")
            }
            def out = namedClientJar.get().asFile
            out.parentFile.mkdirs()
            ant.get(src: minecraftClientUrl, dest: out, skipexisting: true)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        dependsOn tasks.named("downloadMinecraftClientJar")
    }
}

dependencies {
    if (clientLoomEnabled) {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.officialMojangMappings()
        neoForge "net.neoforged:neoforge:${neoforge_version}"

        modImplementation "dev.architectury:architectury-neoforge:${architectury_api_version}"
    } else {
        compileOnly files(
            mappedMinecraftJar,
            neoforgeUniversalJar,
            neoforgeLoaderJar,
            neoforgeBusJar,
            spongeMixinJar
        )
        compileOnly "io.netty:netty-all:4.1.118.Final"
        compileOnly "org.slf4j:slf4j-api:2.0.16"
        compileOnly "com.mojang:brigadier:1.3.10"
        compileOnly "net.neoforged:mergetool:2.0.0:api"
        if (namedClientJarEnabled) {
            compileOnly files(namedClientJar)
        }
    }

    implementation project(":core")
    implementation project(":mod-common")
    implementation "com.github.luben:zstd-jni:${zstd_jni_version}"

    if (clientLoomEnabled) {
        include project(":core")
        include project(":mod-common")
        include "com.github.luben:zstd-jni:${zstd_jni_version}"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraft_version
    inputs.property "neoforge_version", neoforge_version
    inputs.property "architectury_api_version", architectury_api_version
    inputs.property "neoforge_variant", neoforgeVariant
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(
            version: project.version,
            minecraft_version: minecraft_version,
            neoforge_version: neoforge_version,
            architectury_api_version: architectury_api_version,
            mod_id: mod_id,
            mod_name: mod_name
        )
    }
    filesMatching("zstdnet.mixins.json") {
        expand(java_version: java_version)
    }
}

if (!clientLoomEnabled) {
    jar {
        dependsOn configurations.runtimeClasspath
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
        exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
    }
}
